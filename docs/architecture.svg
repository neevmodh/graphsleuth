<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#15181d">GraphSleuth — architecture</text>
  <text x="30" y="54" font-size="12.5" fill="#5b6472">Trigger -> investigate (graph + GraphRAG) -> assess -> deterministic policy -> explain -> memory -> UI</text>

  <!-- Trigger -->
  <rect x="30" y="90" width="150" height="70" rx="10" fill="#ece9fb" stroke="#6b5bd2"/>
  <text x="105" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#15181d">Trigger</text>
  <text x="105" y="133" font-size="10" text-anchor="middle" fill="#5b6472">risk_score /</text>
  <text x="105" y="145" font-size="10" text-anchor="middle" fill="#5b6472">customer_report /</text>
  <text x="105" y="157" font-size="10" text-anchor="middle" fill="#5b6472">analyst_request</text>

  <!-- Orchestrator / Investigator -->
  <rect x="230" y="80" width="270" height="230" rx="10" fill="#fff" stroke="#e3e6eb"/>
  <text x="365" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#15181d">Orchestrator + Investigator</text>
  <text x="365" y="118" font-size="10.5" text-anchor="middle" fill="#5b6472">(agent/orchestrator.py, investigator.py)</text>
  <rect x="248" y="130" width="234" height="26" rx="5" fill="#eef0f4"/>
  <text x="365" y="147" font-size="10.5" text-anchor="middle" fill="#15181d">tool loop: card window, device, region…</text>
  <rect x="248" y="162" width="234" height="26" rx="5" fill="#eef0f4"/>
  <text x="365" y="179" font-size="10.5" text-anchor="middle" fill="#15181d">episode model (stage-2 fraud score)</text>
  <rect x="248" y="194" width="234" height="26" rx="5" fill="#eef0f4"/>
  <text x="365" y="211" font-size="10.5" text-anchor="middle" fill="#15181d">ring / testing / structuring / recurring</text>
  <rect x="248" y="226" width="234" height="26" rx="5" fill="#eef0f4"/>
  <text x="365" y="243" font-size="10.5" text-anchor="middle" fill="#15181d">GraphRAG retrieval (policy/typology/reg.)</text>
  <rect x="248" y="258" width="234" height="26" rx="5" fill="#eef0f4"/>
  <text x="365" y="275" font-size="10.5" text-anchor="middle" fill="#15181d">counterfactuals + uncertainty (#27)</text>

  <!-- TigerGraph -->
  <rect x="560" y="60" width="300" height="270" rx="10" fill="#e5f5ec" stroke="#1f8a4c"/>
  <text x="710" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#15181d">TigerGraph Savanna</text>
  <text x="710" y="98" font-size="10.5" text-anchor="middle" fill="#5b6472">Customer · Card · Transaction · DeviceProfile</text>
  <text x="710" y="112" font-size="10.5" text-anchor="middle" fill="#5b6472">BillingRegion · ClosedCase · FraudCase · DocChunk</text>
  <rect x="578" y="126" width="264" height="26" rx="5" fill="#fff"/>
  <text x="710" y="143" font-size="10.5" text-anchor="middle" fill="#15181d">16 installed GSQL queries</text>
  <rect x="578" y="158" width="264" height="26" rx="5" fill="#fff"/>
  <text x="710" y="175" font-size="10.5" text-anchor="middle" fill="#15181d">ring_component · device_hub_rank (#9)</text>
  <rect x="578" y="190" width="264" height="26" rx="5" fill="#fff"/>
  <text x="710" y="207" font-size="10.5" text-anchor="middle" fill="#15181d">TigerVector: DocChunk.emb similarity search</text>
  <rect x="578" y="222" width="264" height="26" rx="5" fill="#fff"/>
  <text x="710" y="239" font-size="10.5" text-anchor="middle" fill="#15181d">FraudCase write-back (case memory)</text>
  <rect x="578" y="254" width="264" height="26" rx="5" fill="#fff"/>
  <text x="710" y="271" font-size="10.5" text-anchor="middle" fill="#15181d">via TigerGraph MCP server (stdio)</text>
  <text x="710" y="300" font-size="10" text-anchor="middle" fill="#5b6472">590,742 txns · 14,318 cards · 5,565 closed cases · ~2.3M edges</text>

  <!-- LLM router -->
  <rect x="900" y="60" width="250" height="100" rx="10" fill="#fdf1de" stroke="#b26a00"/>
  <text x="1025" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#15181d">LLM router</text>
  <text x="1025" y="100" font-size="10.5" text-anchor="middle" fill="#5b6472">Groq (tool loop, fast)</text>
  <text x="1025" y="115" font-size="10.5" text-anchor="middle" fill="#5b6472">Gemini (synthesis + embeddings)</text>
  <text x="1025" y="133" font-size="10" text-anchor="middle" fill="#5b6472">fact-guarded polish (agent/explain.py):</text>
  <text x="1025" y="147" font-size="10" text-anchor="middle" fill="#5b6472">every number/date/id must survive</text>

  <!-- Policy engine -->
  <rect x="230" y="360" width="270" height="110" rx="10" fill="#fbe8ea" stroke="#c42b3a"/>
  <text x="365" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#15181d">Policy engine (agent/policy.py)</text>
  <text x="365" y="400" font-size="10.5" text-anchor="middle" fill="#5b6472">deterministic: rules R1–R10</text>
  <text x="365" y="416" font-size="10.5" text-anchor="middle" fill="#5b6472">stop rule · route auto / L1 / L2</text>
  <text x="365" y="432" font-size="10.5" text-anchor="middle" fill="#5b6472">SAR gate · case-vs-report gate</text>
  <text x="365" y="452" font-size="10" font-style="italic" text-anchor="middle" fill="#c42b3a">"the LLM proposes; policy disposes"</text>

  <!-- Answer -->
  <rect x="560" y="360" width="300" height="110" rx="10" fill="#fff" stroke="#e3e6eb"/>
  <text x="710" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#15181d">Answer (agent/schemas.py)</text>
  <text x="710" y="400" font-size="10.5" text-anchor="middle" fill="#5b6472">case · evidence · next_best_actions</text>
  <text x="710" y="416" font-size="10.5" text-anchor="middle" fill="#5b6472">sar (grounded narrative + validator)</text>
  <text x="710" y="432" font-size="10.5" text-anchor="middle" fill="#5b6472">stop_reason · tool_calls · tokens</text>
  <text x="710" y="452" font-size="10" text-anchor="middle" fill="#5b6472">cases/HHG-001..020.json</text>

  <!-- UI -->
  <rect x="900" y="360" width="250" height="110" rx="10" fill="#fff" stroke="#e3e6eb"/>
  <text x="1025" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#15181d">API + UI</text>
  <text x="1025" y="400" font-size="10.5" text-anchor="middle" fill="#5b6472">FastAPI + SSE step stream</text>
  <text x="1025" y="416" font-size="10.5" text-anchor="middle" fill="#5b6472">evidence graph · timeline · SAR</text>
  <text x="1025" y="432" font-size="10.5" text-anchor="middle" fill="#5b6472">L1/L2 approve · counterfactuals</text>

  <!-- Autonomous monitor -->
  <rect x="30" y="530" width="360" height="90" rx="10" fill="#eef0f4" stroke="#5b6472" stroke-dasharray="4 3"/>
  <text x="210" y="552" font-size="13" font-weight="700" text-anchor="middle" fill="#15181d">Autonomous monitor (#26, optional)</text>
  <text x="210" y="570" font-size="10.5" text-anchor="middle" fill="#5b6472">find_rings() sweep + bank-risk triage</text>
  <text x="210" y="586" font-size="10.5" text-anchor="middle" fill="#5b6472">-> cases_extra/, never written to the graph</text>
  <text x="210" y="604" font-size="10" text-anchor="middle" fill="#5b6472">run_monitor.py</text>

  <!-- Local dev store -->
  <rect x="430" y="530" width="360" height="90" rx="10" fill="#eef0f4" stroke="#5b6472" stroke-dasharray="4 3"/>
  <text x="610" y="552" font-size="13" font-weight="700" text-anchor="middle" fill="#15181d">Local dev store (agent/backend.py)</text>
  <text x="610" y="570" font-size="10.5" text-anchor="middle" fill="#5b6472">DuckDB mirror of the same schema</text>
  <text x="610" y="586" font-size="10.5" text-anchor="middle" fill="#5b6472">used for training, eval and offline tests</text>
  <text x="610" y="604" font-size="10" text-anchor="middle" fill="#5b6472">GRAPHSLEUTH_BACKEND=local | tigergraph</text>

  <!-- arrows -->
  <line x1="180" y1="125" x2="228" y2="125" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="180" x2="558" y2="180" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="245" x2="558" y2="200" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="130" x2="898" y2="115" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="365" y1="310" x2="365" y2="358" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="410" x2="558" y2="410" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="410" x2="898" y2="410" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="360" x2="710" y2="330" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="720" y="345" font-size="9.5" fill="#5b6472">write back</text>
  <line x1="210" y1="530" x2="560" y2="330" stroke="#5b6472" stroke-width="1" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
  <line x1="365" y1="470" x2="365" y2="500" stroke="#5b6472" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="365" y1="500" x2="610" y2="528" stroke="#5b6472" stroke-width="1" stroke-dasharray="2 3" marker-end="url(#arrow)"/>

  <text x="30" y="700" font-size="10.5" fill="#5b6472">Scoring rubric mapping: accuracy/NBA -> orchestrator+policy; agentic design -> tool loop + counterfactuals;</text>
  <text x="30" y="716" font-size="10.5" fill="#5b6472">innovation -> GraphRAG, graph algorithms, autonomous monitor; explainability -> evidence + SAR + counterfactuals; demo -> UI.</text>
</svg>
