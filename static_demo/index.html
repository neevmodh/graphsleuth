<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphSleuth — read-only demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
:root{
  --bg:#0A0C0F; --panel:#14171C; --panel2:#191D24; --ink:#F3F4F1; --muted:#8A92A1; --faint:#7E8694;
  --line:#242830; --line-soft:#1B1F26;
  --accent:#EC6408; --accent-ink:#FFFFFF; --accent-bg:rgba(236,100,8,.15);
  --info:#43A4DC; --info-bg:rgba(67,164,220,.14);
  --ok:#49C38A; --ok-bg:rgba(73,195,138,.14);
  --warn:#FEBA12; --warn-bg:rgba(254,186,18,.14);
  --bad:#D9534F; --bad-bg:rgba(217,83,79,.14);
  --unc:#43A4DC; --unc-bg:rgba(67,164,220,.14);
  --doc:#1E93A6; --doc-bg:rgba(30,147,166,.14);
  --chip:#191D24; --grid-line:rgba(255,255,255,.035); --shadow:0 12px 32px rgba(0,0,0,.45);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
:root[data-theme="light"]{
  --bg:#F7F5EF; --panel:#FFFFFF; --panel2:#F2EFE6; --ink:#18140C; --muted:#68624F; --faint:#706A55;
  --line:#E0DACB; --line-soft:#EDE8DA;
  --accent:#D65A00; --accent-ink:#FFFFFF; --accent-bg:#FBE7D6;
  --info:#1D6FC4; --info-bg:#DEEBFA;
  --ok:#1F8A4C; --ok-bg:#E5F5EC;
  --warn:#8A5B00; --warn-bg:#FBEFD8;
  --bad:#B23B3B; --bad-bg:#FBE8E8;
  --unc:#1D6FC4; --unc-bg:#DEEBFA;
  --doc:#127E76; --doc-bg:#DFF6F3; --chip:#F2EFE6;
  --grid-line:rgba(0,0,0,.035); --shadow:0 12px 32px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:28px 28px}
.banner{position:relative;z-index:1;background:var(--panel2);color:var(--muted);border-bottom:1px solid var(--line);border-left:3px solid var(--info);padding:8px 22px;font-size:12.5px;text-align:center}
.banner b{font-weight:600;color:var(--info)}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header .mark{width:30px;height:30px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
header .brand{display:flex;flex-direction:column;line-height:1.2}
header h1{font:700 18px 'IBM Plex Sans',sans-serif;margin:0;letter-spacing:-.01em}
header .tag{color:var(--muted);font-size:11.5px}
header .sp{flex:1}
nav.tabs{display:flex;gap:0;border:1px solid var(--line)}
nav.tabs a{padding:7px 13px;font-size:12px;font-weight:600;border:0;border-right:1px solid var(--line);background:var(--panel2);color:var(--muted);text-decoration:none;cursor:pointer;transition:background .15s linear,color .15s linear}
nav.tabs a:last-child{border-right:0}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink)}
button.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 12px;font:600 12px 'IBM Plex Sans',sans-serif;cursor:pointer;transition:border-color .2s linear,color .2s linear}
button.iconbtn:hover{border-color:var(--accent);color:var(--ink)}
main{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 92px)}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 92px);position:sticky;top:92px;display:flex;flex-direction:column}
.qhead{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.qstats{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-bottom:10px}
.qstats b{color:var(--ink);font-family:var(--mono);font-weight:500}
.qsearch{position:relative;margin-bottom:8px}
.qsearch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.55}
.qsearch input{width:100%;padding:8px 10px 8px 30px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:13px 'IBM Plex Sans',sans-serif;outline:none;transition:border-color .2s linear}
.qsearch input:focus{border-color:var(--accent)}
.qtabs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line)}
.qtab{padding:5px 11px;border:0;border-right:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:background .15s linear,color .15s linear}
.qtab:last-child{border-right:0}
.qtab.on{background:var(--accent);color:var(--accent-ink)}
#qlist{flex:1;overflow:auto}
.case{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-soft);background:none;color:inherit;padding:11px 16px;cursor:pointer;font:inherit}
.case:hover{background:var(--panel2)} .case.active{background:var(--accent-bg);border-left:3px solid var(--accent)}
.case .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .r1 span:first-child{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.case.active .r1 span:first-child{color:var(--ink)}
.case .r2{color:var(--faint);font-size:11px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 9px;text-transform:uppercase;letter-spacing:.04em;border:1px solid currentColor}
.chip::before{content:'';width:6px;height:6px;background:currentColor;flex:0 0 auto}
.fraud{background:var(--bad-bg);color:var(--bad)} .legitimate{background:var(--ok-bg);color:var(--ok)}
.uncertain{background:var(--unc-bg);color:var(--unc)} .none{background:var(--chip);color:var(--faint);border-color:var(--line)}
.auto{background:var(--ok-bg);color:var(--ok)} .L1{background:var(--warn-bg);color:var(--warn)} .L2{background:var(--bad-bg);color:var(--bad)}
section.wrap{padding:22px 26px;max-width:1280px;position:relative;z-index:1}
.card{background:var(--panel);border:1px solid var(--line);padding:20px 22px;margin-bottom:16px}
.card h2{margin:0 0 14px;font:600 11px 'IBM Plex Sans',sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card.hero{border-top:3px solid var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:980px){main{grid-template-columns:1fr}aside{position:static;max-height:260px;border-right:0;border-bottom:1px solid var(--line)}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
.kv{display:flex;flex-direction:column;gap:3px}.kv span{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}.kv b{font:700 22px 'IBM Plex Sans',sans-serif}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;padding:9px 18px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer;transition:background .15s linear}
button.primary:hover{background:color-mix(in srgb, var(--accent) 85%, black)}
button.primary:disabled{opacity:.5;cursor:default}
button.mini{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;font:600 11.5px 'IBM Plex Sans',sans-serif;cursor:pointer;margin-left:6px}
button.mini.yes{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)} button.mini.no{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:24px 168px 1fr 60px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);animation:in .2s linear}
.steps .n{width:22px;height:22px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.steps .t{font-family:var(--mono);font-size:12px;color:var(--info)} .steps .ms{color:var(--faint);text-align:right;font-size:11px;font-family:var(--mono)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.gauge{position:relative;height:8px;background:linear-gradient(90deg,var(--ok-bg) 0 35%,var(--unc-bg) 35% 65%,var(--bad-bg) 65% 100%);margin:14px 0 6px;border:1px solid var(--line)}
.gauge i{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);transform:translateX(-1px)}
.gaxis{display:flex;justify-content:space-between;font-size:10px;color:var(--faint)}
.ev{display:flex;gap:10px;margin:9px 0;padding-bottom:9px;border-bottom:1px solid var(--line-soft)}
.ev:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.src{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;color:var(--muted);height:fit-content;min-width:64px;text-align:center;margin-top:1px;border:1px solid currentColor}
.src.graph{color:var(--doc);background:var(--doc-bg)} .src.document{color:var(--unc);background:var(--unc-bg)} .src.customer{color:var(--accent);background:var(--accent-bg)} .src.external{color:var(--muted);background:var(--chip)}
.cf-panel{margin-top:16px;padding:16px;background:var(--panel2);border-left:3px solid var(--info)}
.cf-head{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--info);margin-bottom:8px}
.cf{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
.cf li{padding:8px 10px;color:var(--muted);margin-bottom:6px;line-height:1.5;border-left:2px solid var(--line)}
.cf li.flips{background:var(--accent-bg);color:var(--ink);border-left:2px solid var(--accent)}
.act{display:flex;gap:10px;align-items:flex-start;margin:10px 0;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.act:last-child{border-bottom:0}
.act .nm{font-weight:600;font-family:var(--mono);font-size:12.5px}
.act .why{color:var(--faint);font-size:12px;margin-top:2px}
.act.isnew{background:var(--info-bg);border-left:3px solid var(--info);padding:8px 10px;margin:6px -10px 6px -13px;border-bottom:0}
.flowmark{text-align:center;color:var(--info);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:2px 0 10px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
#graph{height:360px;border:1px solid var(--line);background:var(--panel2)}
pre.sar{white-space:pre-wrap;font:13px/1.7 'IBM Plex Sans',sans-serif;background:var(--panel2);padding:16px 18px;margin:0}
svg text{fill:var(--faint);font:11px 'IBM Plex Mono',monospace}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--faint);margin-top:8px}.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:-1px}
.empty{padding:80px 20px;text-align:center;color:var(--muted)}
.mon-card{background:var(--panel);border:1px solid var(--line);padding:24px 26px;margin-bottom:18px}
.mon-stat span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
.mon-stat b{font:700 20px 'IBM Plex Sans',sans-serif}
</style>
</head>
<body>
<div class="banner"><b>Read-only demo</b> — a frozen snapshot from a real run against live TigerGraph + Groq/Gemini + GraphRAG. No live connection or API keys on this page; "Replay" re-plays the actual recorded steps.</div>
<header>
  <div class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="2.4" stroke="var(--accent-ink)" stroke-width="1.8"></circle><circle cx="5" cy="16" r="2.4" stroke="var(--accent-ink)" stroke-width="1.8"></circle><circle cx="19" cy="16" r="2.4" stroke="var(--accent-ink)" stroke-width="1.8"></circle><path d="M10.3 6.6L6.7 14.1M13.7 6.6l3.6 7.5M7.4 16h9.2" stroke="var(--accent-ink)" stroke-width="1.6" stroke-linecap="round"></path></svg></div>
  <div class="brand"><h1>GraphSleuth</h1><span class="tag">An agentic fraud investigator that thinks in graphs</span></div>
  <span class="sp"></span>
  <nav class="tabs">
    <a id="nav-cases" onclick="showView('cases')">Cases</a>
    <a id="nav-monitor" onclick="showView('monitor')">Autonomous monitor</a>
  </nav>
  <button class="iconbtn" id="theme">Theme</button>
</header>
<main>
  <aside>
    <div class="qhead">
      <div class="qstats" id="qstats"></div>
      <div class="qsearch">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
        <input id="qsearch" placeholder="Search case id">
      </div>
      <div class="qtabs" id="qtabs"></div>
    </div>
    <div id="qlist"></div>
  </aside>
  <section class="wrap" id="view"><div class="empty">Loading…</div></section>
</main>

<script>
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){ if (k==='class') e.className=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2),v); else if (v!==null && v!==undefined) e.setAttribute(k,v); }
  for (const c of kids.flat()){ if (c===null||c===undefined||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const money = x => '$' + Number(x).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const chip = (cls, text) => h('span',{class:'chip '+cls}, text);
const trigIcon = t => ({risk_score:'score',customer_report:'customer',analyst_request:'analyst'}[t]||t);
let cases = [], current = null, qFilter = 'all', qQuery = '', mode = 'cases', localDecisions = {};

const TABS = [['all','All'],['fraud','Fraud'],['uncertain','Uncertain'],['legitimate','Legitimate'],['sar','SAR filed']];

function showView(m){
  mode = m;
  $('#nav-cases').classList.toggle('on', m==='cases');
  $('#nav-monitor').classList.toggle('on', m==='monitor');
  if (m === 'monitor') renderMonitor(); else if (current) select(current); else $('#view').replaceChildren(h('div',{class:'empty'},'Select a case to investigate.'));
}

async function loadQueue(){
  cases = await (await fetch('data/index.json')).json();
  const tabs = $('#qtabs'); tabs.replaceChildren();
  for (const [key,label] of TABS) tabs.append(h('button',{class:'qtab'+(qFilter===key?' on':''), onclick:()=>{ qFilter=key; renderQueue(); }}, label));
  $('#qsearch').oninput = e => { qQuery = e.target.value; renderQueue(); };
  renderQueue();
}

function renderQueue(){
  const n = cases.length, nFraud = cases.filter(c=>c.verdict==='fraud').length,
        nUnc = cases.filter(c=>c.verdict==='uncertain').length, nSar = cases.filter(c=>c.sar).length;
  $('#qstats').replaceChildren(h('span',{},h('b',{},n),' cases'), h('span',{},h('b',{},nFraud),' fraud'),
    h('span',{},h('b',{},nUnc),' uncertain'), h('span',{},h('b',{},nSar),' SAR'));
  document.querySelectorAll('.qtab').forEach((b,i)=>b.classList.toggle('on', TABS[i][0]===qFilter));
  let rows = cases;
  if (qFilter !== 'all') rows = rows.filter(c => qFilter==='sar' ? c.sar : c.verdict===qFilter);
  if (qQuery.trim()) rows = rows.filter(c => c.case_id.toLowerCase().includes(qQuery.trim().toLowerCase()));
  const list = $('#qlist'); list.replaceChildren();
  for (const c of rows){
    list.append(h('button',{class:'case'+(current===c.case_id?' active':''), id:'c-'+c.case_id, onclick:()=>{ mode='cases'; showView('cases'); select(c.case_id); }},
      h('div',{class:'r1'}, h('span',{}, c.case_id), c.verdict?chip(c.verdict,c.verdict):chip('none','not run')),
      h('div',{class:'r2'}, trigIcon(c.trigger_type)+' · '+c.opened_at.slice(0,10)+(c.p!==undefined?' · p='+c.p.toFixed(2):'')+(c.sar?' · SAR':''))));
  }
  if (!rows.length) list.append(h('div',{class:'small faint',style:'padding:16px'},'No cases match.'));
}

let bundleCache = {};
async function select(id){
  current = id;
  document.querySelectorAll('.case').forEach(b=>b.classList.toggle('active', b.id==='c-'+id));
  if (!bundleCache[id]) bundleCache[id] = await (await fetch('data/'+id+'.json')).json();
  render(bundleCache[id]);
}

function render(bundle){
  const { trigger: trig, answer: ans, window: windowData, graph, steps, counterfactuals: cf } = bundle;
  const v = $('#view'); v.replaceChildren();
  const c = ans.case, n = ans.next_best_actions, p = c.fraud_probability;

  v.append(h('div',{class:'card'},
    h('div',{style:'display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap'},
      h('div',{}, h('div',{style:'font:700 20px "IBM Plex Sans",sans-serif'}, trig.case_id+' · '+trigIcon(trig.trigger_type).replace(/^./,c=>c.toUpperCase())+' alert'),
        h('div',{class:'muted small', style:'margin-top:4px'}, 'opened '+trig.opened_at+' · flagged transaction '+trig.flagged_txn_id+' · card '+trig.card_id)),
      h('div',{}, h('button',{class:'primary', id:'run', onclick:()=>replay(steps)}, 'Replay investigation'))),
    h('p',{style:'margin:12px 0 0'}, trig.trigger_text)));

  v.append(h('div',{class:'card hero'},
    h('div',{class:'grid3'},
      h('div',{class:'kv'}, h('span',{},'Verdict'), chip(c.verdict,c.verdict)),
      h('div',{class:'kv'}, h('span',{},'Pattern'), h('b',{style:'font-size:16px'}, c.pattern.replaceAll('_',' '))),
      h('div',{class:'kv'}, h('span',{},'Exposure'), h('b',{}, money(c.exposure_usd))),
      h('div',{class:'kv'}, h('span',{},'Status'), h('b',{style:'font-size:16px'}, c.status.replaceAll('_',' ')))),
    h('div',{class:'gauge'}, h('i',{style:'left:'+(p*100)+'%'})),
    h('div',{class:'gaxis'}, h('span',{},'0.0 legitimate'), h('span',{},'p = '+p.toFixed(2)), h('span',{},'1.0 fraud')),
    h('p',{style:'margin:14px 0 0'}, c.summary),
    cf ? renderCounterfactuals(cf) : null));

  v.append(h('div',{class:'card', id:'stepcard'}, h('h2',{},'Investigation steps (tool calls)'),
    h('ul',{class:'steps', id:'steps'}, steps.map(s=>stepLi(s))),
    h('div',{class:'muted small', id:'stephint'}, '')));

  const changed = n.what_changed && n.what_changed !== 'nothing';
  const beforeSet = new Set(n.initial.map(a=>a.action));
  const actCol = (title, list, isFinal) => h('div',{}, h('h2',{},title), list.map(a => {
    const key = trig.case_id+'::'+a.action;
    const st = localDecisions[key];
    const isNew = isFinal && !beforeSet.has(a.action);
    const ctl = (isFinal && a.route!=='auto') ? h('span',{},
        st ? chip(st==='approved'?'legitimate':'fraud', st) :
        [h('button',{class:'mini yes',onclick:()=>{ localDecisions[key]='approved'; select(current); }},'Approve'),
         h('button',{class:'mini no',onclick:()=>{ localDecisions[key]='rejected'; select(current); }},'Reject')]) : null;
    return h('div',{class:'act'+(isNew?' isnew':'')},
      chip(a.route,a.route==='auto'?'auto':a.route+(a.route==='L1'?' lead':' manager')),
      h('div',{}, h('div',{}, h('span',{class:'nm'},a.action), ctl), h('div',{class:'why'},a.reason)));
  }));
  v.append(h('div',{class:'card'},
    changed ? h('div',{class:'flowmark'}, '↓ recommendation changed after evidence ↓') : null,
    h('div',{class:'grid2'}, actCol('Before requested evidence',n.initial,false), actCol('After requested evidence',n.final,true)),
    h('p',{class:'small',style:'margin:12px 0 0'}, h('b',{},'What changed: '), n.what_changed),
    ans.evidence_requests.length?h('div',{class:'small muted',style:'margin-top:8px'}, ans.evidence_requests.map(r=>h('div',{}, '↳ '+r.type.replaceAll('_',' ')+' requested after step '+r.asked_after_step+' — assumed response: '+r.assumed_response))):null,
    h('p',{class:'small faint',style:'margin:8px 0 0'}, 'The agent may execute only "auto" actions. L1 and L2 actions wait for a human — Approve/Reject here is a local, unsaved demo of that gate.')));

  v.append(h('div',{class:'grid2'},
    h('div',{class:'card'}, h('h2',{},'Evidence'), c.evidence.map(e=>h('div',{class:'ev'}, h('span',{class:'src '+e.source}, e.source), h('div',{class:'small'}, e.claim)))),
    h('div',{class:'card'}, h('h2',{},'Transactions around the alert'), h('div',{id:'tl'}),
      h('div',{class:'legend'}, h('span',{},h('i',{style:'background:var(--bad)'}),'in episode'), h('span',{},h('i',{style:'background:var(--faint);opacity:.6'}),'other'), h('span',{},'◆ flagged')),
      h('h2',{style:'margin-top:18px'},'Memory: similar closed cases'), h('div',{class:'small'}, c.similar_prior_cases.length?c.similar_prior_cases.join(', '):'none relevant'))));

  v.append(h('div',{class:'card'}, h('h2',{},'Evidence graph'), h('div',{id:'graph'})));
  v.append(h('div',{class:'card'}, h('h2',{},'Suspicious activity report'),
    ans.sar.file ? h('div',{}, h('div',{class:'small muted',style:'margin-bottom:8px'}, ans.sar.reason+' · '+money(ans.sar.total_amount_usd)+' · '+ans.sar.activity_dates.join(' → ')), h('pre',{class:'sar'}, ans.sar.narrative))
                 : h('div',{class:'small faint'}, 'No report. '+ans.sar.reason)));
  v.append(h('div',{class:'card small faint'}, 'Stop reason: '+ans.stop_reason+' · '+ans.tool_calls+' tool calls · '+ans.latency_s+' s · written to TigerGraph: '+(c.written_to_graph?'yes ('+c.graph_case_id+')':'no (local case memory only)')));

  if (windowData && windowData.length) drawTimeline(windowData); else $('#tl').append(h('div',{class:'muted small'},'No online window recorded for this case.'));
  if (graph) drawGraph(graph);
}

function stepLi(s){
  return h('li',{}, h('span',{class:'n'},s.n), h('span',{class:'t'},s.tool), h('span',{}, s.summary), h('span',{class:'ms'}, s.ms+' ms'));
}

function replay(steps){
  const list = $('#steps'); if (!list) return;
  list.replaceChildren();
  const btn = $('#run'); if (btn){ btn.disabled = true; btn.textContent = 'Replaying…'; }
  steps.forEach((s,i)=> setTimeout(()=>{ list.append(stepLi(s)); if (i===steps.length-1 && btn){ btn.disabled=false; btn.textContent='Replay investigation'; } }, i*260));
}

function renderCounterfactuals(d){
  const u = d.uncertainty;
  const panel = h('div',{class:'cf-panel'},
    h('div',{class:'cf-head'}, 'Uncertainty · '+u.distance.toFixed(2)+' from the '+u.nearest_threshold+' threshold ('+u.threshold_value+')'),
    h('div',{class:'small muted'}, d.counterfactuals.length?'What would flip the decision:':'No single evidence signal alone would flip it.'));
  if (d.counterfactuals.length) panel.append(h('ul',{class:'cf'}, d.counterfactuals.map(c => h('li',{class:c.crosses.length?'flips':''}, c.description))));
  return panel;
}

function drawTimeline(w){
  const box = $('#tl'); if (!box||!w.length) return;
  const W = 520, H = 190, m = {l:36,r:10,t:8,b:22};
  const xs = w.map(d=>+new Date(d.ts.replace(' ','T'))), x0 = Math.min(...xs), x1 = Math.max(...xs)||x0+1;
  const ly = d => Math.log10(d.amt+1), y1 = Math.max(...w.map(ly),1) * 1.12;
  const X = t => m.l + (t-x0)/(x1-x0||1)*(W-m.l-m.r), Y = a => H-m.b - a/y1*(H-m.t-m.b);
  const ns='http://www.w3.org/2000/svg', el=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const svg = el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});
  for (const a of [1,10,100,1000,10000]) if (Math.log10(a+1)<=y1){ svg.append(el('line',{x1:m.l,x2:W-m.r,y1:Y(Math.log10(a+1)),y2:Y(Math.log10(a+1)),stroke:'currentColor','stroke-opacity':.12}));
      const t=el('text',{x:m.l-4,y:Y(Math.log10(a+1))+3,'text-anchor':'end'}); t.textContent='$'+a; svg.append(t); }
  for (const d of w){
    const cx=X(+new Date(d.ts.replace(' ','T'))), cy=Y(ly(d));
    const node = d.flagged ? el('rect',{x:cx-6,y:cy-6,width:12,height:12,transform:`rotate(45 ${cx} ${cy})`,fill:d.in_episode?'var(--bad)':'var(--faint)',stroke:'var(--ink)','stroke-width':1.5})
                           : el('circle',{cx,cy,r:d.in_episode?5:3.5,fill:d.in_episode?'var(--bad)':'var(--faint)','fill-opacity':d.in_episode?.9:.45});
    const t = el('title',{}); t.textContent = `${d.ts}  ${money(d.amt)}  ${d.channel}  first-stage p=${(d.p??0).toFixed(2)}${d.m!=null?'  episode p='+d.m.toFixed(2):''}`; node.append(t); svg.append(node);
  }
  box.append(svg);
}

function drawGraph(g){
  const box = $('#graph'); if (!box) return;
  if (typeof cytoscape==='undefined'){ box.replaceChildren(h('div',{class:'muted small',style:'padding:14px'},'Graph library unavailable offline.')); return; }
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
  const color = {customer:col('--faint'),card:col('--accent'),txn:col('--bad'),device:col('--warn'),connected:col('--bad'),closedcase:col('--ok')};
  const cy = cytoscape({container:box, elements:[...g.nodes.map(n=>({data:n})), ...g.edges.map((e,i)=>({data:{id:'e'+i,source:e.s,target:e.t,label:e.label}}))],
    style:[{selector:'node',style:{'background-color':ele=>color[ele.data('type')]||'#888',label:'data(label)','font-size':9,color:col('--ink'),'text-valign':'bottom','text-margin-y':3,width:ele=>ele.data('focus')?26:ele.data('type')==='device'?24:14,height:ele=>ele.data('focus')?26:ele.data('type')==='device'?24:14}},
           {selector:'edge',style:{width:1,'line-color':col('--line'),'curve-style':'bezier','target-arrow-shape':'triangle','target-arrow-color':col('--faint'),'arrow-scale':.6}}],
    layout:{name:'concentric',animate:false,padding:24,minNodeSpacing:16,startAngle:0,
            concentric:n=>({device:5,card:4,txn:3,customer:2,connected:1,closedcase:1}[n.data('type')]||1),levelWidth:()=>1}});
  cy.resize(); cy.fit(undefined,24);
  cy.on('mouseover','node',e=>{const t=e.target.data('title'); box.title=t||e.target.data('label');});
}

let monitorCache = null;
async function renderMonitor(){
  if (!monitorCache) monitorCache = await (await fetch('data/monitor.json')).json();
  const v = $('#view'); v.replaceChildren();
  v.append(h('div',{class:'card'},
    h('div',{style:'display:flex;align-items:center;gap:10px;margin-bottom:8px'},
      h('span',{style:'font:700 20px "IBM Plex Sans",sans-serif'},'Autonomous monitor'),
      h('span',{class:'chip none'},'innovation · optional')),
    h('p',{}, 'Sweeps the whole graph for alerts the 20 sampled benchmark cases never triggered on — every ring-like device found, not just the sampled one, and the highest bank-risk-score transactions that were never sampled. Both feed the same investigation pipeline; output is never written back to the graph.')));
  for (const m of monitorCache){
    const c = m.case;
    v.append(h('div',{class:'mon-card'},
      h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px'},
        h('span',{style:'font-family:var(--mono);color:var(--muted)'}, m.case_id+' · '+(m.monitor_reason||'')),
        chip(c.verdict, c.verdict)),
      h('div',{class:'grid3'},
        h('div',{class:'mon-stat'}, h('span',{},'Probability'), h('b',{}, c.fraud_probability.toFixed(2))),
        h('div',{class:'mon-stat'}, h('span',{},'Pattern'), h('b',{}, c.pattern.replaceAll('_',' '))),
        h('div',{class:'mon-stat'}, h('span',{},'Exposure'), h('b',{}, money(c.exposure_usd))),
        h('div',{class:'mon-stat'}, h('span',{},'Report'), h('b',{}, m.sar.file?'Filed':'—'))),
      h('p',{class:'small muted',style:'margin-top:12px'}, c.summary)));
  }
}

$('#theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light'; };
loadQueue().then(()=>{ showView('cases'); if (cases.length) select(cases[0].case_id); });
